version: '3.9'

services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    environment:
      - LIVEKIT_CONFIG=/etc/livekit.yaml
    ports:
      - "7880:7880"      # HTTP
      - "7881:7881/tcp"  # TURN/TCP
      - "7882:7882/udp"  # WebRTC
      - "50000-60000:50000-60000/udp"  # RTP
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Redis for multi-instance deployments
